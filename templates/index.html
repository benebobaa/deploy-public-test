<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <meta name="description" content="{{.Description}}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        
        .description {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }
        
        .info {
            background: #f8f9fa;
            border-radius: 5px;
            padding: 20px;
            margin: 30px 0;
        }
        
        .info-item {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            color: #555;
        }
        
        .info-value {
            color: #764ba2;
            font-family: monospace;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
        }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            background: #28a745;
            color: white;
            border-radius: 3px;
            font-size: 0.8rem;
            margin-left: 5px;
            font-weight: 500;
        }
        
        .production {
            background: #dc3545;
        }
        
        .staging {
            background: #ffc107;
            color: #333;
        }
        
        .development {
            background: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{.Title}}</h1>
        <p class="description">{{.Description}}</p>
        
        <div class="info">
            <div class="info-item">
                <span class="info-label">Version</span>
                <span class="info-value">{{.Version}}</span>
            </div>
            <div class="info-item">
                <span class="info-label">Environment</span>
                <span class="info-value">
                    {{.Environment}}
                    {{if eq .Environment "production"}}
                    <span class="badge production">PROD</span>
                    {{else if eq .Environment "staging"}}
                    <span class="badge staging">STAGING</span>
                    {{else}}
                    <span class="badge development">DEV</span>
                    {{end}}
                </span>
            </div>
            <div class="info-item">
                <span class="info-label">Contact</span>
                <span class="info-value">{{.Contact}}</span>
            </div>
        </div>
        
        <a href="mailto:{{.Contact}}" class="cta-button">Get in Touch</a>
    </div>
</body>
</html>
